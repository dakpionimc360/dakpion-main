# Auto deploy: every push to the main branch uploads the changed files to the cPanel server over FTP.
# Needs these repo secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER     e.g. ftp.dakpionimc.com
#   FTP_USERNAME   cPanel FTP account
#   FTP_PASSWORD   its password
#   (the FTP account must open in the site folder: files go to its starting folder, ./)
# data/ and uploads/ hold the live database and images: they are never uploaded, changed or deleted.

name: Deploy to cPanel

on:
  push:
    branches: [claude/vigilant-gauss-8pvwxd, main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean up server name
        env:
          HOST: ${{ secrets.FTP_SERVER }}
        run: |
          # Accept "ftp://ftp.example.com:21/", "https://example.com" etc. and keep only the host name.
          h="$(printf '%s' "$HOST" | tr -d '[:space:]')"
          h="${h#*://}"; h="${h%%/*}"; h="${h%%:*}"
          echo "::add-mask::$h"
          echo "FTP_HOST=$h" >> "$GITHUB_ENV"

      - name: Upload changed files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The FTP account opens in the site folder, so upload right there ("/" is the hosting home, not the site).
          server-dir: ./
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            data/**
            uploads/**
            inc/local.php
            frames/**
            .playwright-mcp/**
            *.zip
            s-index-*.png
            DEPLOY.md
